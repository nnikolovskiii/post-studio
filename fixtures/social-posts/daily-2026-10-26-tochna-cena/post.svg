<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- daily-2026-10-26 · Mosaic (landing1 live tokens: paper #F6F2EA, ink #1D2129, accent #23487F once, in the render) -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="26" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="window" cx="0.18" cy="0.10" r="1.15">
      <stop offset="0.35" stop-color="#1D2129" stop-opacity="0"/>
      <stop offset="1" stop-color="#1D2129" stop-opacity="0.10"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#F6F2EA"/>
  <g id="art">
    <image href="file:///home/user/workspace/social-posts/posts/daily-2026-10-26-tochna-cena/art/render-mid.png" x="0" y="0" width="1080" height="1080" preserveAspectRatio="none"/>
  </g>
  <!-- light falls off away from the window (top left), so the desk reads as lit, not as a flat fill -->
  <rect width="1080" height="1080" fill="url(#window)"/>
  <rect width="1080" height="1080" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
  <g id="type" font-family="'Alegreya', serif" font-weight="700" font-size="84" fill="#1D2129" style="font-feature-settings:&quot;lnum&quot; 1">
    <text x="135" y="148">Цената ја знаете</text>
    <text x="135" y="240">пред да почнеме.</text>
  </g>
</svg>
