<title>Виолетова соба со табла: три картички. „Цртам“ и „топка“ се назад; крената е „парк“ со дрво и лулашка. Детска рака со виолетов ракав го допира дрвото, со розов круг. Розов чип вели „Сакам парк.“ со звучник. Горе пишува „Избирам слика. Се изразувам.“ Долу десно Kites.</title>
