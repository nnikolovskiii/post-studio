<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<title>Ноќе, под ламба, на темна маса: голем црвен клуч лежи дијагонално преку отпечатен лист со код и знакот &lt;/&gt;. На алката на клучот виси етикета „вашиот-бизнис.мкд“. Горе пишува „Кодот и доменот се ваши.“</title>
<rect id="paper" width="1080" height="1080" fill="#221F1B"/>
<defs>
<filter id="fx-wobble" x="-2%" y="-2%" width="104%" height="104%">
  <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="fx-grain-dark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11" stitchTiles="stitch"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.133  0 0 0 0 0.122  0 0 0 0 0.106  5.5 0 0 0 -3.05"/>
</filter>
<filter id="fx-grain-light" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="29" stitchTiles="stitch"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.961  0 0 0 0 0.937  0 0 0 0 0.894  0 6 0 0 -3.55"/>
</filter>
<filter id="fx-concrete" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.035 0.11" numOctaves="5" seed="3" result="n"/>
  <feDiffuseLighting in="n" surfaceScale="2.4" lighting-color="#FFFFFF" diffuseConstant="1.05">
    <feDistantLight azimuth="235" elevation="52"/>
  </feDiffuseLighting>
</filter>
<pattern id="pt-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
  <circle cx="4.5" cy="4.5" r="1.6" fill="#221F1B"/>
</pattern>
<linearGradient id="gr-dusk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#221F1B" stop-opacity="0.9"/>
  <stop offset="0.3" stop-color="#221F1B" stop-opacity="0.78"/>
  <stop offset="0.85" stop-color="#221F1B" stop-opacity="0.66"/>
  <stop offset="1" stop-color="#221F1B" stop-opacity="0.42"/>
</linearGradient>
<radialGradient id="gr-halo" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#F2D49A" stop-opacity="0.8"/>
  <stop offset="0.5" stop-color="#F2D49A" stop-opacity="0.32"/>
  <stop offset="1" stop-color="#F2D49A" stop-opacity="0"/>
</radialGradient>
</defs>
