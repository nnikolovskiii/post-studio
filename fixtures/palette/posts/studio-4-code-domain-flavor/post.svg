  <stop offset="0.45" stop-color="#F2D49A" stop-opacity="0.26"/>
  <stop offset="1" stop-color="#F2D49A" stop-opacity="0"/>
</radialGradient>
<pattern id="pt-dots-light" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
  <circle cx="5" cy="5" r="1.7" fill="#F5EFE4"/>
</pattern>
</defs>
